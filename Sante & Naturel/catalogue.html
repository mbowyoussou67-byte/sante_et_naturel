<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#087e9b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Santé & Naturel">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="description" content="Consultez le catalogue des produits Forever Living de Santé & Naturel à Dakar et commandez sur WhatsApp.">
    <title>Catalogue | Santé & Naturel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { theme: { extend: { colors: { snGreen: '#087e9b', snLightGreen: '#0ea5c6', snDark: '#102b43' }, fontFamily: { sans: ['Poppins', 'sans-serif'] } } } };</script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="site.css?v=20261015-update-notification">
    <link rel="stylesheet" href="site-update-notice-v18.css">
    <script src="site.js?v=20261015-update-notification" defer></script>
    <script src="site-update-notice-v18.js" defer></script>
    <script src="catalogue.js" defer></script>
</head>
<body data-page="catalogue" class="font-sans text-slate-800">
    <header data-site-header></header>
    <main>
        <section class="ice-hero px-4 py-14 sm:px-6 lg:py-18">
            <div class="mx-auto flex max-w-7xl flex-col gap-6 md:flex-row md:items-end md:justify-between">
                <div class="max-w-3xl">
                    <p class="font-semibold uppercase tracking-[0.16em] text-snGreen">La sélection Santé & Naturel</p>
                    <h1 class="mt-3 text-4xl font-bold tracking-tight text-slate-900 sm:text-5xl">Catalogue des produits</h1>
                    <p class="mt-4 text-lg leading-8 text-slate-600">Découvrez les produits, consultez leurs bienfaits et vérifiez leur disponibilité dans la boutique.</p>
                </div>
                <a href="contact.html" class="inline-flex shrink-0 items-center justify-center gap-2 rounded-full bg-snGreen px-6 py-3 font-semibold text-white transition hover:bg-snLightGreen"><i class="fab fa-whatsapp"></i>Un renseignement ?</a>
            </div>
        </section>
        <section class="px-4 py-12 sm:px-6 lg:py-16">
            <div class="mx-auto mb-9 max-w-7xl rounded-3xl border border-sky-100 bg-white p-5 shadow-sm sm:p-7">
                <div class="flex flex-col gap-5 lg:flex-row lg:items-center lg:justify-between">
                    <div>
                        <h2 class="text-lg font-bold text-slate-900">Disponibilité en boutique</h2>
                        <p class="mt-1 text-sm text-slate-600">Disponibilité des produits.</p>
                        <p id="stock-data-status" class="mt-2 text-sm text-slate-600" role="status" aria-live="polite"></p>
                    </div>
                    <div class="grid gap-4 sm:grid-cols-2 lg:w-[34rem]">
                        <div>
                            <label for="product-search" class="mb-2 block text-sm font-semibold text-slate-700">Rechercher</label>
                            <input id="product-search" type="search" autocomplete="off" placeholder="Produit, ingrédient, bienfait…" aria-describedby="search-results" class="w-full rounded-xl border border-sky-200 bg-sky-50/50 px-4 py-3 text-sm text-slate-900 outline-none transition focus:border-snGreen focus:ring-2 focus:ring-cyan-100">
                        </div>
                        <div>
                            <label for="stock-filter" class="mb-2 block text-sm font-semibold text-slate-700">Disponibilité</label>
                            <select id="stock-filter" class="w-full rounded-xl border border-sky-200 bg-sky-50/50 px-4 py-3 text-sm text-slate-900 outline-none transition focus:border-snGreen focus:ring-2 focus:ring-cyan-100">
                                <option value="all">Tous les produits</option>
                                <option value="available">Disponibles</option>
                                <option value="unavailable">Indisponibles</option>
                            </select>
                        </div>
                    </div>
                </div>
                <p id="search-results" class="mt-4 text-sm text-slate-600" role="status" aria-live="polite"></p>
            </div>
            <div id="product-categories" class="mx-auto max-w-7xl space-y-14"></div>
        </section>
    </main>
    <footer data-site-footer></footer>
</body>
</html>
